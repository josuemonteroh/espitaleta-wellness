server {

    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index login.html;

    location / {

        try_files $uri $uri/ /login.html;

    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|otf)$ {

        expires 30d;
        add_header Cache-Control "public";

        try_files $uri =404;

    }

    error_page 404 /login.html;

}